# Régie telle qu'écrite dans le PM (col. régie) ou le PDR (col. PLATEFORME) -> valeurs URL Builder.
# alias : comparés en début de mot, sans accents ni majuscules.
# regie : valeur de la liste Régie (col. Y). null = absente de la liste Inputs A79 (à y ajouter).
# code : code régie dans le nom de créa (col. AD).
# plateforme_gag : col. Q si l'achat est en gré à gré (null = inconnue, l'expert choisit).
# a_valider: true = proposition déduite des PM, pas encore confirmée par un expert.

# ---- Validées (URL Builder MDC SDG V2) ----
youtube:   {alias: [youtube], regie: Youtube, code: Youtube, plateforme_gag: null}
spotify:   {alias: [spotify], regie: Spotify, code: Spotify, plateforme_gag: Spotify_FRA}
m6:        {alias: [m6], regie: M6, code: M6, plateforme_gag: M6+}
tf1:       {alias: [tf1], regie: TF1, code: TF1, plateforme_gag: DV360}   # GAG -> DV360 : vu sur TTF1 (in-content banner)
france-tv: {alias: [france tv, france-tv, francetv, ftv], regie: France-TV, code: FTV, plateforme_gag: null}
weborama:  {alias: [weborama], regie: Weborama, code: Weborama, plateforme_gag: weborama}

