# ==== 3. Cas généraux (MDC SDG, confirmés ailleurs sauf conflit indiqué) ====
- mots_cles: [parent, famille, enfant, foyers avec enfant]                       # vu partout
  targeting_type: 3rd - Audience prio
  targeting_details: Familles
  code: Familles
# Conflit TT YouTube : 3rd - Contextuel (MDC SDG) / 3rd - Audience prio (BDP V5) / 3rd-Party-Targeting (TTF1, MDC V5) / 3rd - Interets (Pâques)
- mots_cles: [value shopper, promophile, chasseurs de promo, bonnes affaires, promo]
  targeting_type: 3rd-Party-Targeting
  targeting_details: Promovores
  code: Promovores
  par_regie:
    youtube: {targeting_type: 3rd - Contextuel}
- mots_cles: [senior, "60+", "+55", retirement]                                  # vu partout
  targeting_type: 3rd - Audience prio
  targeting_details: Seniors
  code: Seniors
# Conflit : 3rd - Interets / Petit-conso-TV (MDC SDG) / 3rd - Interets / PetitconsoTV (Pâques) / 3rd-Party-Targeting / PetitconsoTV (TTF1)
- mots_cles: [petit conso tv, light tv]
  targeting_type: 3rd - Interets
  targeting_details: Petit-conso-TV
  code: PetitconsoTV
- mots_cles: [aise, csp, hauts revenus, luxury]                                  # vu partout (code Aises sur BDP V5)
  targeting_type: 3rd - Audience prio
  targeting_details: Aisés / CSP+
  code: CSPplus
# TD Contextual constant ; TT varie : 3rd - Contextuel (MDC SDG) / 3rd-Party-Targeting (BDPV2, MDC V5) / 3rd - Interets (Pâques)
- mots_cles: [food, gourmet, epicurien, cooking]
  targeting_type: 3rd - Contextuel
  targeting_details: Contextual
  code: Food
  par_regie:
    youtube: {code: Contextuel-food}
    m6: {code: Gourmets}
    weborama: {code: Epicuriens}

# ==== 4. Synonymes des cas généraux ====
- {mots_cles: [family, foyer], targeting_type: 3rd - Audience prio, targeting_details: Familles, code: Familles, a_valider: true}
- {mots_cles: [bon plan, discount, bargain], targeting_type: 3rd-Party-Targeting, targeting_details: Promovores, code: Promovores, par_regie: {youtube: {targeting_type: 3rd - Contextuel}}, a_valider: true}
- {mots_cles: [silver, "50+", "+50", "+ de 50", "+60"], targeting_type: 3rd - Audience prio, targeting_details: Seniors, code: Seniors, a_valider: true}
- {mots_cles: [recette, cuisine, gastronomie, vin, gourmand], targeting_type: 3rd - Interets, targeting_details: Contextual, code: Food, par_regie: {youtube: {code: Contextuel-food}, m6: {code: Gourmets}, weborama: {code: Epicuriens}}}   # vu : Pâques
- {mots_cles: [contextuel, contextual, documentaire, semantique], targeting_type: 3rd - Contextuel, targeting_details: Contextual, code: Contextuel}   # vu : Pâques (FTV)
