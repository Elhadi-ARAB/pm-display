# Libellé d'audience PM -> Targeting Type (col. T), Targeting details (col. U), code créa (fin col. AD).
# mots_cles : un mot-clé correspond s'il apparaît en début de mot. Une sous-liste = tous les mots requis.
# debut_par : le libellé doit commencer par l'un de ces textes.
# sauf : l'entrée est ignorée si l'un de ces mots-clés est présent.
# regie : réservé à une ou plusieurs régies (testé en premier).
# par_regie : surcharge d'un champ pour une régie donnée.
# a_valider: true = pas confirmé par un URL Builder, ou contredit d'une campagne à l'autre.
# Commentaire « vu : » = URL Builders où la valeur a été constatée. L'ordre compte.

# ==== 1. Propres à une régie ====
- {regie: [spotify], mots_cles: ["25 - 54", "25-54"], targeting_type: 3rd - Broad, targeting_details: Socio-demo, code: 25-54ans}   # vu : MDC SDG, BDP V5
# Conflit 55+ Spotify/Deezer : Socio-demo (MDC SDG) / Seniors (BDP V5, MDC V5)
- {regie: [spotify], mots_cles: ["55+", "55 +"], targeting_type: 3rd - Broad, targeting_details: Socio-demo, code: 55ans}
- {regie: [spotify, deezer], mots_cles: ["25-44", "25 - 44"], targeting_type: 3rd - Broad, targeting_details: Socio-demo, code: 25-44ans}   # vu : TTF1
- {regie: [spotify, deezer], mots_cles: ["+45", "45+", "45 ans et"], targeting_type: 3rd - Broad, targeting_details: Socio-demo, code: 45ans}   # vu : TTF1
- {regie: [spotify, deezer], mots_cles: ["25-49", "25 - 49"], targeting_type: 3rd - Broad, targeting_details: Socio-demo, code: 25-49ans, a_valider: true}
- {regie: [spotify], mots_cles: [targeting 3p], targeting_type: 3rd - Audience prio, targeting_details: Familles/Seniors/Mots-clés/Promovores, code: Custom}   # vu : RDC V2
